name: public-safety-tests
on:
  push:
    branches: [main, public-mirror]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline dialogue/knowledge/safety tests
        run: node --test --test-concurrency=1 tests/dialogue.test.mjs tests/knowledge.test.mjs tests/safety.test.mjs
