# ሕግ 1፦ አንድ ኃላፊነት → አንድ A (የባለቤት መስፈርት R-29)። 123ቱ መለያዎች በአንድ ክፍል A ውስጥ ብቻ ይመዘገባሉ።
# ሕግ 2፦ `roles` ዝርዝሩ የv2.8 `owner_role` ዋጋዎች ናቸው (ቃል በቃል)፤ እያንዳንዱ የv2.8 ባለቤት ስም
#   በአንድ ክፍል ውስጥ ብቻ ይኖራል — 29 ስሞች 11 ክፍሎች ውስጥ ተደራጅተዋል።
# ሕግ 3፦ ክፍል 5 ላይ ያሉ ማዛመሪያ ጥያቄዎች `status: PROPOSED`ና`owner_decision: PENDING` ብቻ ናቸው።
#   ባለቤቱ ሳይወስን v2.8 የተቀየረበት አይደለም፤ ለውጥ የሚፈጸመው CR በኩል ብቻ ነው (R-41)።
# ማረጋገጫ ዘዴ፦ `node --test tests/ownership.test.mjs` — ክፍልና መለያ ከv2.8፣ ከሰንጠረዥ ሰነድና
#   ከመስፈርት መዝገብ ጋር ይነጻጸራል። ይህ ፋይል ብቻ ከተቀየረ ፍተሻው ወድቆ ግጭቱ ግልጽ ይሆናል።
